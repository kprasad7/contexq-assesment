name: CD - Deploy to AWS

# Automated deployment pipeline for data infrastructure and Spark jobs
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'terraform/**'
      - '.github/workflows/cd.yml'

jobs:
  deploy:
    name: Deploy Spark Jobs, Airflow DAG, and Infrastructure
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    environment:
      name: production
      url: https://console.aws.amazon.com/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false
      - name: Validate Python syntax
        run: |
          python -m py_compile src/spark/*.py
          python -m py_compile src/airflow/dags/*.py

      - name: Pre-validate scripts
        run: |
          echo "✅ Scripts will be uploaded after Terraform creates buckets"

      - name: Validate Terraform
        run: |
          echo "🔍 Validating Terraform configuration..."
          cd terraform
          terraform init -backend=false
          terraform validate
          terraform fmt -check -recursive || true
          echo "✅ Terraform validation passed"

      - name: Ensure Terraform backend exists
        run: |
          echo "🗄️ Ensuring Terraform backend resources exist..."
          
          # Create S3 bucket for state if it doesn't exist
          aws s3api head-bucket --bucket contexq-terraform-state-119287772129 2>/dev/null || \
            aws s3api create-bucket \
              --bucket contexq-terraform-state-119287772129 \
              --region us-east-1
          
          # Enable versioning on state bucket
          aws s3api put-bucket-versioning \
            --bucket contexq-terraform-state-119287772129 \
            --versioning-configuration Status=Enabled
          
          # Create DynamoDB table for locks if it doesn't exist
          aws dynamodb describe-table --table-name contexq-terraform-locks --region us-east-1 2>/dev/null || \
            aws dynamodb create-table \
              --table-name contexq-terraform-locks \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1
          
          echo "✅ Backend resources ready"

      - name: Plan Terraform infrastructure
        id: tf_plan
        run: |
          echo "📋 Planning Terraform infrastructure changes..."
          cd terraform
          terraform init -reconfigure
          terraform plan -var-file=environments/dev.tfvars -out=tfplan
          
          # Show plan summary
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan | tail -50 >> $GITHUB_STEP_SUMMARY

      - name: Apply Terraform infrastructure
        run: |
          echo "🚀 Applying Terraform infrastructure..."
          cd terraform
          terraform apply -auto-approve tfplan
          echo "✅ Infrastructure deployed successfully"
          
          # Show key outputs
          echo "## Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY

      - name: Export Terraform outputs as environment variables
        id: tf_outputs
        run: |
          cd terraform
          echo "raw_bucket=$(terraform output -raw s3_raw_bucket_name)" >> $GITHUB_OUTPUT
          echo "processed_bucket=$(terraform output -raw s3_processed_bucket_name)" >> $GITHUB_OUTPUT
          echo "mwaa_bucket=$(terraform output -raw mwaa_dags_bucket)" >> $GITHUB_OUTPUT
          echo "etl_job=$(terraform output -raw glue_job_name)" >> $GITHUB_OUTPUT
          echo "ml_job=$(terraform output -raw glue_ml_training_job_name)" >> $GITHUB_OUTPUT
          echo "glue_db=$(terraform output -raw glue_database_name)" >> $GITHUB_OUTPUT

      - name: Upload Spark jobs to S3 (post-Terraform)
        run: |
          echo "📤 Uploading Spark job scripts to S3..."
          echo "Target bucket: ${{ steps.tf_outputs.outputs.raw_bucket }}"
          
          # Upload comprehensive ETL job
          aws s3 cp src/spark/comprehensive_etl_job.py \
            s3://${{ steps.tf_outputs.outputs.raw_bucket }}/glue-scripts/comprehensive_etl_job.py
          
          # Upload ML training job
          aws s3 cp src/spark/ml_training_job.py \
            s3://${{ steps.tf_outputs.outputs.raw_bucket }}/glue-scripts/ml_training_job.py
          
          echo "✅ Spark jobs uploaded successfully"

      - name: Upload Airflow DAG to MWAA
        run: |
          echo "📤 Deploying Airflow DAG to MWAA..."
          echo "Target MWAA bucket: ${{ steps.tf_outputs.outputs.mwaa_bucket }}"
          
          # Upload DAG
          aws s3 cp src/airflow/dags/olist_data_pipeline.py \
            s3://${{ steps.tf_outputs.outputs.mwaa_bucket }}/dags/olist_data_pipeline.py
          
          echo "✅ Airflow DAG uploaded successfully"
          echo "ℹ️ MWAA will auto-sync DAG from S3 within 1 minute"

      - name: Upload source data files to S3
        run: |
          echo "📥 Uploading source data files..."
          
          # Upload source CSV files
          aws s3 cp olist_order_items_dataset.csv \
            s3://${{ steps.tf_outputs.outputs.raw_bucket }}/source_supply/olist_order_items_dataset.csv
          
          aws s3 cp olist_order_payments_dataset.csv \
            s3://${{ steps.tf_outputs.outputs.raw_bucket }}/source_financial/olist_order_payments_dataset.csv
          
          aws s3 cp olist_sellers_dataset.csv \
            s3://${{ steps.tf_outputs.outputs.raw_bucket }}/source_supply/olist_sellers_dataset.csv
          
          echo "✅ Source data files uploaded successfully"

      - name: Verify Glue jobs created by Terraform
        run: |
          echo "✅ Verifying Glue jobs created by Terraform..."
          
          echo "Expected ETL job: ${{ steps.tf_outputs.outputs.etl_job }}"
          echo "Expected ML job: ${{ steps.tf_outputs.outputs.ml_job }}"
          
          # Verify jobs exist in AWS
          aws glue get-job --job-name "${{ steps.tf_outputs.outputs.etl_job }}" --region us-east-1 > /dev/null && echo "✅ ETL job verified"
          aws glue get-job --job-name "${{ steps.tf_outputs.outputs.ml_job }}" --region us-east-1 > /dev/null && echo "✅ ML job verified"
          
          echo "✅ All Glue jobs verified"

      - name: Trigger Airflow DAG refresh
        run: |
          echo "🔄 Verifying MWAA DAG deployment..."
          
          # Verify DAG is accessible
          aws s3 ls s3://${{ steps.tf_outputs.outputs.mwaa_bucket }}/dags/olist_data_pipeline.py
          echo "✅ DAG file verified in S3"

      - name: Run smoke tests against deployed infrastructure
        run: |
          echo "🔬 Running smoke tests..."
          
          # Verify S3 buckets exist
          echo "Checking S3 buckets..."
          aws s3 ls s3://${{ steps.tf_outputs.outputs.raw_bucket }}/ > /dev/null && echo "✅ raw-data bucket accessible"
          aws s3 ls s3://${{ steps.tf_outputs.outputs.processed_bucket }}/ > /dev/null && echo "✅ processed-data bucket accessible"
          
          # Verify Glue database exists
          echo "Checking Glue database..."
          aws glue get-database --name ${{ steps.tf_outputs.outputs.glue_db }} --region us-east-1 > /dev/null && echo "✅ Glue database found"
          
          # Verify Glue jobs exist
          echo "Checking Glue jobs..."
          aws glue get-job --job-name ${{ steps.tf_outputs.outputs.etl_job }} --region us-east-1 > /dev/null && echo "✅ ETL job exists"
          aws glue get-job --job-name ${{ steps.tf_outputs.outputs.ml_job }} --region us-east-1 > /dev/null && echo "✅ ML job exists"
          
          # Verify Iceberg table
          echo "Checking Iceberg table..."
          aws glue get-table --database-name ${{ steps.tf_outputs.outputs.glue_db }} --name corporate_registry --region us-east-1 > /dev/null && echo "✅ Iceberg table exists"
          
          echo "✅ All smoke tests passed"

      - name: Create deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Components" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Spark ETL Job: \`${{ steps.tf_outputs.outputs.etl_job }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Spark ML Training Job: \`${{ steps.tf_outputs.outputs.ml_job }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Airflow DAG: \`olist_data_pipeline\` (MWAA)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Glue Database: \`${{ steps.tf_outputs.outputs.glue_db }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Iceberg Table: \`corporate_registry\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure Airflow Variables in MWAA (raw_data_bucket, processed_data_bucket)" >> $GITHUB_STEP_SUMMARY
          echo "2. Set up MLflow tracking server (optional)" >> $GITHUB_STEP_SUMMARY
          echo "3. Trigger DAG manually or wait for schedule" >> $GITHUB_STEP_SUMMARY
          echo "4. Monitor execution in CloudWatch logs" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment completion
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ CD Pipeline Completed Successfully"
          else
            echo "❌ CD Pipeline Failed"
            exit 1
          fi

  rollback:
    name: Automatic Rollback (if deployment fails)
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Rollback to previous version
        run: |
          echo "⏮️ Rolling back deployment..."
          
          # Rollback is handled by Terraform state management
          # For script rollback, get previous versions from S3 versioning
          echo "ℹ️ S3 versioning enabled - previous script versions preserved"
          echo "Manual rollback: restore previous version from S3 console if needed"
          
          echo "⚠️ Deployment failed - review logs for details"

      - name: Alert on failure
        run: |
          echo "⚠️ Deployment failed and was rolled back"
          echo "⚠️ Please review the CD pipeline logs for details"
